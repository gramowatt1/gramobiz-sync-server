# Render Blueprint — powers the "Deploy to Render" button in README.md. A customer clicking that
# button deploys this exact service + database onto their OWN Render account, not ours: their
# bill (Render's free tier has real limits — see README), their data, their instance.
databases:
  - name: gramobiz-sync-db
    databaseName: gramobiz_sync
    user: gramobiz
    plan: free

services:
  - type: web
    name: gramobiz-sync-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gramobiz-sync-db
          property: connectionString
      - key: PORT
        value: 4100
      # Render generates a real random value for this automatically — find it under this
      # service's Environment tab after deploying, and use it as the "setup key" when
      # registering your first till (see README.md).
      - key: SETUP_KEY
        generateValue: true
